function button(label,fn){let b=document.createElement('button');b.className='primary';b.textContent=label;b.onclick=fn;panel.appendChild(b);return b}
function updateHud(){$('progress').innerHTML=`<span>DELIVERY ${stage}/4</span>`+CONFIG.quests.map((_,i)=>`<i class="gem ${i<stage?'on':''}"></i>`).join('');$('area').textContent=screen==='end'?'QUEST CLEAR':screen==='intro'||screen==='map'?'TOKYO → SENDAI':CONFIG.quests[Math.min(stage,3)].area;$('worldhint').textContent=screen==='intro'?'TOKYO → SENDAI':screen==='map'?'光る場所を選んで冒険を進めよう':screen==='end'?'TO BE CONTINUED...':'BIRTHDAY EXPRESS'}
function intro(){screen='intro';html(`<div class="kicker">NEW GAME · SPECIAL EDITION</div><h1>${esc(CONFIG.title)}<br><span style="font-size:13px;color:#e4b979;letter-spacing:2px">BIRTHDAY EXPRESS</span></h1><p>${esc(CONFIG.intro)}</p>`);button('▶ お祝いを届ける',()=>{tone();map()});panel.insertAdjacentHTML('beforeend','<p class="small" style="text-align:center;margin:12px 0 0">♪ 音楽と一緒に、冒険を楽しんでね。</p>');}
function map(){screen='map';html(`<div class="kicker">WORLD MAP · ${String(stage+1).padStart(2,'0')}/04</div><h2>次の目的地へ</h2><p>東京から仙台へ。<br>次の駅を選んで配達を進めよう！</p><div class="maplist">${CONFIG.quests.map((q,i)=>`<button class="loc ${i===stage?'current':i<stage?'done':''}" data-i="${i}" ${i!==stage?'disabled':''}><span>${q.icon}</span><div>${esc(q.name)}<small>${i<stage?'✓ CLEAR':i===stage?'▶ NEXT':'🔒 LOCKED'}</small></div></button>`).join('')}</div>`);panel.querySelectorAll('.loc').forEach(b=>b.onclick=()=>travel(+b.dataset.i));}
function travel(i){if(screen!=='map'||moving||i!==stage)return;tone();moving=true;target=nodes[i];panel.querySelectorAll('button').forEach(b=>b.disabled=true);$('worldhint').textContent='お祝いを乗せて、北へ向かっています…';if(reduced){hero={...target};target=null;moving=false;quest()}}
function quest(){screen='quest';wrongAttempts=0;let q=CONFIG.quests[stage];html(`<div class="kicker">QUEST ${String(stage+1).padStart(2,'0')} · ${esc(q.name)}</div><h2>${q.icon} ${esc(q.name)}</h2><p>${esc(q.intro)}</p><p style="color:#f7d797;font-weight:700;margin-bottom:10px">${esc(q.question)}</p><div class="choices">${q.choices.map((v,i)=>`<button class="choice" data-i="${i}"><b>${'ABC'[i]}</b>${esc(v)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`);panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b));}
function answer(i,b){let q=CONFIG.quests[stage];if(q.answer!==null&&i!==q.answer){wrongAttempts++;tone('wrong');b.classList.add('wrong');$('feedback').textContent=wrongAttempts===1?'おしい！ 何度でも挑戦できるよ。':'まだ大丈夫！ もう一度考えてみよう。';return}if(q.answer===null)chosenFuture=q.choices[i];tone('win');b.classList.add('correct');panel.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>reward(q),reduced?0:350)}
function reward(q){screen='reward';stage++;html(`<div class="kicker">★ QUEST CLEAR!</div><h2>贈り物を手に入れた！</h2><div class="reward"><span class="emoji">${q.icon}</span><div><strong>${esc(q.reward)}</strong><small>GIFT ${stage} / 4</small></div></div><p>${esc(q.message)}</p>`);button(stage===4?'お祝いを受け取る ▶':'次の駅へ ▶',()=>{tone();stage===4?chest():map()})}
function chest(){screen='chest';html(`<div class="kicker">FINAL QUEST · ALL DELIVERY FOUND</div><h2>仙台に、お祝いが到着！</h2><p>東京から運んだ4つの贈り物。<br>全部まとめて、たいきにお届けします。</p><div class="book">${CONFIG.quests.map(q=>`<div><span>◆</span> ${esc(q.reward)}</div>`).join('')}</div>`);button('✦ プレゼントを開ける ✦',()=>{tone('win');ending()})}
function ending(){screen='end';html(`<div class="kicker">THE BEST ADVENTURE IS STILL AHEAD</div><h1>HAPPY<br>BIRTHDAY!</h1><div class="finalstamp">✦ QUEST COMPLETE ✦</div><p>${esc(CONFIG.ending)}</p><div class="book" style="text-align:center;font-size:12px;color:#f8d696;line-height:1.7">NEXT CHAPTER<br>12.05 — 会いに行く日</div><div class="finalstamp">東京から、たいきへ。 ♥</div>`);let r=document.createElement('button');r.className='replay';r.textContent='もう一度旅をする';r.onclick=()=>{stage=0;hero={...start};moving=false;target=null;chosenFuture='';intro()};panel.appendChild(r)}
// Original pixel-art scenery. All artwork is rendered locally without image files.
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),w,h)}
function polygon(points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function tree(x,y,s=1){rect(x-2*s,y-10*s,4*s,12*s,'#795a4e');rect(x-8*s,y-18*s,16*s,11*s,'#2b655b');rect(x-5*s,y-23*s,10*s,5*s,'#3e8270');rect(x-10*s,y-14*s,20*s,5*s,'#417b65');rect(x-4*s,y-20*s,6*s,4*s,'#72a47b')}
function house(x,y,col='#d9a888',roof='#a86676'){rect(x-11,y-17,22,17,col);polygon([[x-15,y-17],[x,y-29],[x+15,y-17]],roof);rect(x-14,y-18,28,3,'#764d65');rect(x-4,y-10,8,10,'#59475a');rect(x-9,y-12,4,5,'#ffe3a0');rect(x+6,y-12,4,5,'#ffe3a0');rect(x+5,y-28,4,8,'#a5817b')}
function star(x,y,col='#ffdc90',s=1){rect(x-1*s,y-3*s,2*s,6*s,col);rect(x-3*s,y-1*s,6*s,2*s,col)}
function sprite(x,y,t){let bob=moving?Math.floor(t/7)%2:0;y-=bob;rect(x-6,y-1,12,3,'#345b55');rect(x-4,y-9,8,6,'#b35e77');rect(x-5,y-8,2,5,'#e69e99');rect(x+4,y-8,2,5,'#e69e99');rect(x-4,y-17,8,8,'#f1c596');rect(x-5,y-18,10,4,'#533e4e');rect(x-3,y-20,7,3,'#533e4e');rect(x-4,y-15,2,2,'#533e4e');rect(x+2,y-14,1,2,'#47364a');rect(x-4,y-3,3,4,'#34394e');rect(x+1,y-3,3,4,'#34394e');rect(x+5,y-6,3,5,'#e3b77c')}
let seed=91;function rand(){seed=(seed*16807)%2147483647;return seed/2147483647}const dots=Array.from({length:160},()=>[rand()*320,rand()*160+78,rand()]);const stars=Array.from({length:45},()=>[rand()*320,rand()*70,rand()]);
function label(x,y,name,active){c.font='bold 8px monospace';c.textAlign='center';let w=c.measureText(name).width+10;rect(x-w/2,y-9,w,13,active?'#69475e':'#263850');c.fillStyle=active?'#ffe7a5':'#f0ebde';c.fillText(name,x,y);}
function skyline(x,y,n){for(let i=0;i<n;i++){let h=12+(i*19%27),w=9+i%3*3;rect(x+i*12,y-h,w,h,i%2?'#51657e':'#62788b');for(let j=4;j<h-2;j+=6){rect(x+i*12+2,y-h+j,2,2,'#ffe1a3');if(i%2)rect(x+i*12+6,y-h+j,2,2,'#d6c7a5')}}}
function scenery(){rect(0,0,320,240,'#9ab6bd');rect(0,0,320,46,'#344664');rect(0,46,320,20,'#62788e');rect(0,66,320,17,'#9caeb2');rect(270,14,19,19,'#f8dba8');rect(266,19,27,10,'#f8dba8');stars.forEach(([x,y,r])=>{if(y<48)star(x,y,r>.8?'#ffe4a4':'#a1b0c7',.5)});
polygon([[0,102],[44,47],[84,94],[131,50],[178,100],[228,46],[280,91],[320,53],[320,150],[0,150]],'#657e92');polygon([[24,72],[44,47],[63,72],[44,65]],'#d9e7e5');polygon([[111,74],[131,50],[151,72],[130,66]],'#e6ece7');polygon([[208,69],[228,46],[246,65],[227,59]],'#e6ece7');
polygon([[0,112],[61,96],[120,117],[188,88],[249,105],[320,80],[320,240],[0,240]],'#b9cecb');polygon([[0,158],[69,137],[132,168],[201,129],[278,145],[320,123],[320,240],[0,240]],'#a2bdb9');polygon([[0,219],[66,204],[139,224],[211,190],[320,206],[320,240],[0,240]],'#c4d5cf');dots.forEach(([x,y,r])=>{if(y>110)rect(x,y,r>.8?3:1,1,r>.5?'#e1e9df':'#8daaa9')});
polygon([[0,125],[35,115],[77,123],[130,192],[181,210],[242,240],[215,240],[168,224],[118,204],[66,137],[36,129],[0,139]],'#759db1');
let path=[start,...nodes];c.lineCap='round';c.lineJoin='round';c.beginPath();path.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle='#617780';c.lineWidth=12;c.stroke();c.strokeStyle='#efe2c6';c.lineWidth=8;c.stroke();c.setLineDash([2,5]);c.strokeStyle='#879399';c.lineWidth=5;c.stroke();c.setLineDash([]);
[[9,150],[19,167],[101,197],[141,188],[155,150],[221,165],[283,119],[297,151],[303,206],[64,112],[168,94],[242,93],[310,91],[220,219]].forEach(([x,y],i)=>{tree(x,y,i%4===0?1.1:.8);rect(x-5,y-18,10,3,'#d9e6dd')});
skyline(12,181,5);rect(36,143,4,33,'#a96670');rect(32,153,12,3,'#d9a6a0');rect(30,164,16,3,'#d9a6a0');house(103,135,'#d6bba2','#886f80');house(139,140,'#d6bba2','#886f80');house(171,88,'#d4b69b','#8c7583');house(204,90,'#d4b69b','#8c7583');skyline(241,54,5);
['TOKYO','UTSUNOMIYA','FUKUSHIMA','SENDAI'].forEach((name,i)=>label(nodes[i].x,nodes[i].y+15,name,i===stage));
// Falling snow
stars.forEach(([x,y,r],i)=>{let yy=reduced?y*3.3:(y*3.3+frame*(.12+r*.22))%240;rect((x+Math.sin(yy/25+i)*4+320)%320,yy,r>.85?2:1,1,'#edf4e6')});
}
function train(x,y){rect(x-12,y-6,24,11,'#2b4258');rect(x-11,y-12,19,9,'#f5ede0');rect(x+8,y-9,5,6,'#f5ede0');rect(x-11,y-5,24,2,'#bd697d');for(let i=0;i<3;i++)rect(x-8+i*6,y-10,4,4,'#5d879b');rect(x-8,y+2,5,3,'#334353');rect(x+6,y+2,5,3,'#334353');star(x+14,y-6,'#ffe3a3',.5);}
function draw(){frame++;scenery();if(moving&&target){let dx=target.x-hero.x,dy=target.y-hero.y,d=Math.hypot(dx,dy);if(d<1.7){hero={...target};target=null;moving=false;quest()}else{hero.x+=dx/d*1.7;hero.y+=dy/d*1.7}}
nodes.forEach((p,i)=>{let col=i<stage?'#e6b86d':i===stage?'#fff2b5':'#8d9c92';rect(p.x-8,p.y-3,16,5,'#405d56');polygon([[p.x,p.y-16],[p.x+6,p.y-10],[p.x,p.y-4],[p.x-6,p.y-10]],col);if(i===stage&&screen==='map'){let yy=p.y-28-(reduced?0:Math.floor(Math.sin(frame/9)*2));polygon([[p.x-4,yy],[p.x+4,yy],[p.x,yy+5]],'#fff2b5');star(p.x+9,p.y-19,'#fff2b5')}});if(moving)train(hero.x,hero.y);else sprite(hero.x,hero.y,frame);
if(screen==='chest'||screen==='end'){rect(0,0,320,240,'#26344d');stars.forEach(([x,y,r],i)=>{let yy=y*3.2;star(x,yy,(i+Math.floor(frame/24))%3===0?'#f9d99b':'#8593ae',r>.9?2:1)});let x=160,y=139;rect(x-29,y-4,58,5,'#172336');rect(x-24,y-23,48,22,'#ad735d');rect(x-24,y-24,48,5,'#f0bf79');rect(x-20,y-18,40,12,'#bc8262');rect(x-25,y-23,4,22,'#ecc084');rect(x+21,y-23,4,22,'#ecc084');rect(x-4,y-17,8,7,'#ffdf95');rect(x-1,y-14,2,3,'#704d51');if(screen==='chest'){rect(x-24,y-36,48,14,'#cb906c');rect(x-20,y-40,40,4,'#f0bf79');rect(x-24,y-27,48,5,'#f0bf79');rect(x-4,y-40,8,37,'#eec88e');rect(x-15,y-30,30,5,'#eec88e');polygon([[x,y-40],[x-16,y-51],[x-18,y-43],[x,y-38]],'#f1d09a');polygon([[x,y-40],[x+16,y-51],[x+18,y-43],[x,y-38]],'#f1d09a')}else{polygon([[x-23,y-26],[x-23,y-48],[x+23,y-48],[x+23,y-26]],'#9d655f');rect(x-23,y-49,46,5,'#edc07a');rect(x-19,y-26,38,5,'#fff3b0');for(let i=0;i<16;i++){let a=i*Math.PI/8,dist=24+(reduced?10:(frame*0.8+i*11)%68);star(x+Math.cos(a)*dist,y-30+Math.sin(a)*dist,i%2?'#f4a1a9':'#ffe4a0',1)}polygon([[147,77],[147,69],[154,65],[160,70],[166,65],[173,69],[173,77],[160,90]],'#ee93a8')};sprite(160,169,frame)}requestAnimationFrame(draw)}
intro();draw();
