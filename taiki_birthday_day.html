function fortuneArt(n){return `<svg viewBox="0 0 280 254" aria-hidden="true"><defs><linearGradient id="woodA"><stop stop-color="#8e542e"/><stop offset=".32" stop-color="#d5a06b"/><stop offset=".78" stop-color="#b77944"/><stop offset="1" stop-color="#76452e"/></linearGradient><linearGradient id="woodB"><stop stop-color="#f4c992"/><stop offset="1" stop-color="#a56a3e"/></linearGradient><clipPath id="stickClip"><rect x="116" y="8" width="48" height="80"/></clipPath></defs><circle cx="140" cy="107" r="94" fill="#d8a56d" opacity=".07"/><g fill="none" stroke="#ddbe8e" opacity=".23"><path d="M26 47 Q140 6 254 47M35 55Q140 20 245 55"/><path d="M32 54v131m216-131v131M23 72h234" stroke-width="3"/></g><ellipse cx="140" cy="234" rx="90" ry="9" fill="#0f1628" opacity=".65"/><g class="omikuji-tube"><g clip-path="url(#stickClip)"><g class="omikuji-stick"><rect x="130" y="12" width="20" height="93" rx="2" fill="#f2d6a0" stroke="#946847"/><path d="M134 16v84m12-84v84" stroke="#d9b582"/><text id="stickNumber" x="140" y="33" text-anchor="middle" fill="#8c4037" font-size="10" font-family="serif">${n===null?'':String(n+1).padStart(2,'0')}</text><text x="140" y="47" text-anchor="middle" fill="#633e32" font-size="9">番</text></g></g><path d="M91 82L103 73H177L189 82V208L176 224H104L91 208Z" fill="url(#woodA)" stroke="#795036" stroke-width="2"/><path d="M103 84V213M177 84V213" stroke="#72432f" opacity=".65"/><path d="M109 97q8 49 0 99M169 97q-7 45 0 100" fill="none" stroke="#e9ba84" opacity=".4" stroke-width="1.4"/><path d="M91 82L103 72H177L189 82L177 91H103Z" fill="url(#woodB)" stroke="#8b5736" stroke-width="1.5"/><ellipse cx="140" cy="81" rx="13" ry="4" fill="#402c25"/><path d="M94 99h92M94 203h92" stroke="#825137" stroke-width="6"/><path d="M94 97h92M94 201h92" stroke="#e5ba79" stroke-width="1"/><rect x="122" y="111" width="36" height="78" rx="2" fill="#f7e6c2" stroke="#9a4b3d" stroke-width="1.6"/><rect x="126" y="115" width="28" height="70" fill="none" stroke="#b96b55" stroke-width=".7"/><text x="140" y="131" font-size="13" fill="#914339" text-anchor="middle" font-family="serif"><tspan x="140">御</tspan><tspan x="140" dy="15">神</tspan><tspan x="140" dy="15">籤</tspan></text><path d="M133 177h14" stroke="#b96b55"/><circle cx="140" cy="174" r="2" fill="#b96b55"/></g><g fill="#edce94" opacity=".8"><path d="M57 105l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/><path d="M224 146l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/></g></svg>`}
function fortune(){const raw=load('fortune'),saved=Number.isInteger(raw)&&fortunes[raw]?raw:null;const container=el('content');container.innerHTML=`<p>おはよう、たいき！<br>誕生日の朝、今年の運勢を占ってみよう。<br>心の中で願いごとをひとつ。</p><div class="shrine-stage"><button class="interactive-art ${saved!==null?'stick-out':''}" id="fortuneTube" aria-label="おみくじの筒を振る" ${saved!==null?'disabled':''}>${fortuneArt(saved)}</button><div id="fortuneHint" class="scene-caption">${saved!==null?`第${String(saved+1).padStart(2,'0')}番`:'木の筒をタップ、または上下に振ってね'}</div></div><div id="outcome"></div>`;if(saved!==null){showFortune(saved);return}const tube=el('fortuneTube'),out=el('outcome');out.innerHTML='<button class="primary" id="draw">おみくじの筒を振る</button>';let busy=false,downY=null;async function draw(){if(busy||!tube.isConnected)return;busy=true;const n=Math.floor(Math.random()*fortunes.length);save('fortune',n);save('done1',true);tube.disabled=true;el('draw').disabled=true;el('fortuneHint').textContent='カラカラ… 運勢を占っています';toySound('shake');tube.classList.add('shake-tube');await pause(1350);if(!tube.isConnected)return;tube.classList.remove('shake-tube');el('stickNumber').textContent=String(n+1).padStart(2,'0');tube.classList.add('stick-out');toySound('drop');await pause(700);if(!tube.isConnected)return;el('fortuneHint').textContent=`第${String(n+1).padStart(2,'0')}番の棒が出たよ！`;out.innerHTML='<button class="primary" id="openFortune">おみくじの紙を開く ✦</button>';el('openFortune').onclick=()=>{toySound('win');celebrate();showFortune(n)}}tube.onclick=draw;el('draw').onclick=draw;tube.onpointerdown=e=>{downY=e.clientY;tube.setPointerCapture?.(e.pointerId)};tube.onpointerup=e=>{if(downY!==null&&Math.abs(e.clientY-downY)>24)draw();downY=null};tube.onpointercancel=()=>downY=null;}
function showFortune(n){const f=fortunes[n];el('outcome').innerHTML=`<div class="fortune-paper"><div class="fortune-number">第 ${String(n+1).padStart(2,'0')} 番</div><div class="seal">誕生日特別御神籤</div><h3>${f.name}</h3><hr><p>${f.msg}</p><hr><p>ラッキーアイテム<br><b>${f.item}</b></p><p>たいきへのひとこと<br>${f.word}</p></div><button class="primary" id="next">贈り物一覧へ</button>`;el('next').onclick=home}
const prizes=[['💆','マッサージ券','今度会ったときに、ゆっくりマッサージするね。'],['🍳','好きなご飯作る券','食べたいものをリクエストしてね。'],['🗺️','デート先決定券','次のデートの行き先はたいきが決めてね。'],['🤗','ぎゅーっとハグ券','会えたときに、好きなだけぎゅーしよう。']];
const prizeColors=['#e5a1b9','#edc27f','#a9c9d7','#b5a6e0'];
function collected(){let list=load('prizes');if(!Array.isArray(list)){const old=load('prize');list=Number.isInteger(old)&&prizes[old]?[old]:[];}return [...new Set(list.filter(n=>Number.isInteger(n)&&prizes[n]))]}
function machineArt(list){const remaining=prizes.map((_,i)=>i).filter(i=>!list.includes(i));const positions=[[96,108],[154,108],[124,77],[168,69]];return `<svg viewBox="0 0 260 300" aria-hidden="true"><defs><linearGradient id="machineBody"><stop stop-color="#a95d81"/><stop offset=".45" stop-color="#e7a9bf"/><stop offset="1" stop-color="#a9658b"/></linearGradient><linearGradient id="glass"><stop stop-color="#4d6078"/><stop offset="1" stop-color="#24324d"/></linearGradient><linearGradient id="goldKnob"><stop stop-color="#ffe6ac"/><stop offset="1" stop-color="#c28d50"/></linearGradient></defs><ellipse cx="130" cy="288" rx="87" ry="8" fill="#101728" opacity=".7"/><rect x="53" y="12" width="154" height="268" rx="24" fill="url(#machineBody)" stroke="#f2c4cb" stroke-width="2"/><rect x="68" y="24" width="124" height="19" rx="7" fill="#753e64"/><text x="130" y="37" text-anchor="middle" font-size="9" letter-spacing="1.4" font-weight="bold" fill="#fbe4ae">TAIKI GACHA</text><rect x="65" y="48" width="130" height="93" rx="16" fill="url(#glass)" stroke="#f5d69b" stroke-width="3"/><g class="machine-balls">${remaining.map((n,j)=>{const [x,y]=positions[j];return `<g data-ball="${n}"><circle cx="${x}" cy="${y}" r="19" fill="${prizeColors[n]}" stroke="#fff3df" stroke-width=".9"/><path d="M${x-19} ${y} A19 19 0 0 0 ${x+19} ${y}Z" fill="#f4e6d4" opacity=".85"/><ellipse cx="${x-6}" cy="${y-8}" rx="5" ry="3" fill="white" opacity=".55"/></g>`}).join('')}</g><path d="M78 59q-7 18-5 52M84 58h24" fill="none" stroke="#ffffff" opacity=".17" stroke-width="5" stroke-linecap="round"/><rect x="84" y="150" width="92" height="66" rx="12" fill="#c27d95" stroke="#eab7c7"/><circle cx="130" cy="183" r="28" fill="#a46c70" stroke="#f2c88c" stroke-width="2"/><g class="machine-knob"><circle cx="130" cy="183" r="23" fill="url(#goldKnob)" stroke="#ffe7b5" stroke-width="1.5"/><rect x="111" y="177" width="38" height="12" rx="5" fill="#86536c" stroke="#f5d39e" stroke-width="1.2"/><circle cx="130" cy="183" r="3" fill="#e9bd85"/></g><path d="M167 181a37 37 0 0 1-15 29" stroke="#fae1a8" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M150 204l1 8 7-3" stroke="#fae1a8" stroke-width="1.8" fill="none"/><rect x="90" y="230" width="80" height="37" rx="9" fill="#242b41" stroke="#e5b2bc" stroke-width="2"/><path d="M97 257h66" stroke="#505b73" stroke-width="2"/><g class="drop-ball"><circle cx="130" cy="246" r="15" id="dropColor" fill="#e5a1b9" stroke="#fff0d5"/><path d="M115 246a15 15 0 0 0 30 0Z" fill="#fff0d5"/><ellipse cx="125" cy="240" rx="4" ry="2.5" fill="white" opacity=".7"/></g><rect x="65" y="273" width="130" height="6" rx="3" fill="#8b5276"/></svg>`}
function collectionHTML(list){return list.length?`<div class="collection"><div class="collection-title">GETした引換券 · ${list.length} / ${prizes.length}</div>${list.map(n=>`<details><summary>${prizes[n][0]} ${prizes[n][1]}</summary><p>${prizes[n][2]}</p></details>`).join('')}<p class="note">いつでもここから見返せるよ。</p></div>`:''}
function gacha(){let list=collected();const container=el('content');container.innerHTML=`<p>お昼のお祝いは、たいき専用のガチャ！<br>何が当たるかは、回してからのお楽しみ。<br>今日は特別、全部出るまで回していいよ♡</p><div class="remaining" id="remaining"></div><div class="capsule-stage"><button class="interactive-art" id="machine" aria-label="ガチャガチャのハンドルを回す" ${list.length===prizes.length?'disabled':''}>${machineArt(list)}</button></div><div class="scene-caption" id="machineHint"></div><div id="outcome"></div><div id="collection"></div>`;const machine=el('machine'),out=el('outcome');let busy=false;function refresh(showCollection=true){el('remaining').innerHTML=Array.from({length:prizes.length},(_,i)=>`<i class="${i<list.length?'used':''}"></i>`).join('')+` 残り ${prizes.length-list.length} 個`;if(showCollection)el('collection').innerHTML=collectionHTML(list)}function ready(){refresh();if(list.length===prizes.length){machine.disabled=true;el('machineHint').textContent='SOLD OUT · すべてのカプセルをGET！';out.innerHTML='<div class="complete-text">全種類コンプリート！ 🎉</div><p>全部たいきへのプレゼントだよ。<br>今度会ったときに使ってね。</p><button class="primary" id="next">贈り物一覧へ</button>';el('next').onclick=home;return}el('machineHint').textContent='ハンドルをタップ、または回すようにスワイプ';out.innerHTML=`<button class="primary" id="draw">${list.length?'もっとガチャガチャする？ ↻':'ハンドルを回す！ ↻'}</button><button class="secondary" id="next">贈り物一覧へ</button>`;el('draw').onclick=spin;el('next').onclick=home;machine.disabled=false;busy=false;}
async function spin(){if(busy||!machine.isConnected||list.length>=prizes.length)return;busy=true;machine.disabled=true;const draw=el('draw');if(draw)draw.disabled=true;const pool=prizes.map((_,i)=>i).filter(i=>!list.includes(i)),n=pool[Math.floor(Math.random()*pool.length)];list=[...list,n];save('prizes',list);save('done2',true);machine.style.removeProperty('--turn');el('machineHint').textContent='ガチャ、ガチャ、ガチャ…';toySound('turn');machine.classList.add('turning');await pause(950);if(!machine.isConnected)return;machine.querySelector(`[data-ball="${n}"]`)?.remove();el('dropColor').setAttribute('fill',prizeColors[n]);machine.classList.add('dropped');toySound('drop');await pause(650);if(!machine.isConnected)return;machine.classList.remove('turning','dropped');machine.classList.add('ready-capsule');refresh(false);el('machineHint').textContent='コロン！ カプセルが出てきたよ';out.innerHTML='<button class="primary" id="openCapsule">カプセルを開ける ✦</button>';el('openCapsule').onclick=()=>reveal(n);machine.disabled=false;}
function reveal(n){const p=prizes[n];machine.disabled=true;toySound('win');celebrate();out.innerHTML=`<svg class="capsule-reveal" viewBox="0 0 110 100" aria-hidden="true"><path d="M23 54a32 32 0 0 0 64 0Z" fill="#f8e9d5" stroke="#e7bd91"/><g class="ticket-pop"><rect x="39" y="26" width="32" height="39" rx="3" fill="#ffdfa1" stroke="#bb8858"/><path d="M45 39h20m-20 6h20m-20 6h14" stroke="#bb8858"/><text x="55" y="35" text-anchor="middle" font-size="7" fill="#a46951">GIFT</text></g><g class="cap-top"><path d="M23 54a32 32 0 0 1 64 0Z" fill="${prizeColors[n]}" stroke="#f8e9d5"/><ellipse cx="44" cy="36" rx="9" ry="4" fill="white" opacity=".45"/></g></svg><div class="prize-ticket"><div class="eyebrow">SPECIAL BIRTHDAY TICKET · ${list.length}/${prizes.length}</div><div style="font-size:33px;margin-top:7px">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><p>スクリーンショットで保存してね。</p></div>${list.length<prizes.length?'<button class="primary" id="again">もっとガチャガチャする？ ↻</button>':'<div class="complete-text">全種類コンプリート！ 🎉</div><p>全部たいきへのプレゼントだよ。</p>'}<button class="secondary" id="next">贈り物一覧へ</button>`;el('next').onclick=home;if(el('again'))el('again').onclick=()=>{machine.classList.remove('ready-capsule');machine.innerHTML=machineArt(list);ready();spin()};if(list.length===prizes.length)el('machineHint').textContent='SOLD OUT · すべてGET！';refresh()}
let gesture=null;machine.onclick=()=>{if(busy){if(machine.classList.contains('ready-capsule'))el('openCapsule')?.click();return}spin()};machine.onpointerdown=e=>{if(busy||machine.disabled)return;const knob=machine.querySelector('.machine-knob').getBoundingClientRect();const cx=knob.left+knob.width/2,cy=knob.top+knob.height/2;gesture={cx,cy,x:e.clientX,y:e.clientY,last:Math.atan2(e.clientY-cy,e.clientX-cx),turn:0};machine.setPointerCapture?.(e.pointerId)};machine.onpointermove=e=>{if(!gesture||busy)return;const a=Math.atan2(e.clientY-gesture.cy,e.clientX-gesture.cx);let d=a-gesture.last;if(d>Math.PI)d-=2*Math.PI;if(d< -Math.PI)d+=2*Math.PI;gesture.turn+=d;gesture.last=a;machine.style.setProperty('--turn',`${gesture.turn*180/Math.PI}deg`)};machine.onpointerup=e=>{if(!gesture)return;const moved=Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>18||Math.abs(gesture.turn)>.35;gesture=null;if(moved)spin();else machine.style.removeProperty('--turn')};machine.onpointercancel=()=>{gesture=null;machine.style.removeProperty('--turn')};ready()}
function rpg(){el('content').innerHTML='<span class="giftbox">🚄</span><p>今日の最後の贈り物は、小さな冒険。<br>東京から仙台まで、たいきへのお祝いを届ける旅に出よう。</p><a id="rpgLink" class="link" href="./birthday_express_taiki_music.html">冒険を始める ▶</a><p class="note">音楽が流れるよ。</p>';el('rpgLink').onclick=()=>save('done3',true)}
let lastMidnight=Date.now()>=date(0);home();timerId=setInterval(()=>{if(!preview&&!lastMidnight&&Date.now()>=date(0)){lastMidnight=true;openChapter(0);celebrate()}else updateHome()},500);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!preview&&!lastMidnight&&Date.now()>=date(0)){lastMidnight=true;openChapter(0);celebrate()}else updateHome()}});
</script></body></html>
