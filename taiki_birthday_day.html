<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c35"><title>TAIKI'S BIRTHDAY — 12.02</title><style>
*{box-sizing:border-box} :root{color-scheme:dark;--gold:#f4d79e;--muted:#b9b7cd;--pink:#f0b1bc}body{margin:0;background:radial-gradient(ellipse at 50% 0,#41415e 0,#202a46 36%,#12192e 85%);color:#fff2e1;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;min-height:100dvh;padding:24px 16px 45px}main{max-width:460px;margin:auto;position:relative;z-index:1}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #ffe5b2;outline-offset:4px}header{text-align:center;padding:13px 5px 22px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold)}h1{font-family:Georgia,serif;font-size:37px;font-weight:400;letter-spacing:2px;margin:14px 0 6px;line-height:1.1}h2{font-size:23px;line-height:1.5;margin:10px 0}p{font-size:13px;line-height:1.9;color:#e2dce0;margin:8px 0;white-space:pre-line}.sub{letter-spacing:2px;font-size:12px;color:#d6cad5}.hero{width:100%;height:145px;margin:12px auto 0;display:block}.panel{background:#202841d9;border:1px solid #a294774d;border-radius:20px;padding:20px;box-shadow:0 14px 40px #0a10234d;text-align:center}.timer{display:flex;justify-content:center;gap:9px;margin:15px 0 8px}.timer div{background:#121b32;border:1px solid #67718a55;border-radius:10px;min-width:72px;padding:12px 6px}.timer strong{display:block;font-size:26px;font-weight:400;font-family:Georgia,serif;font-variant-numeric:tabular-nums;color:var(--gold)}.timer small{font-size:9px;letter-spacing:1px;color:var(--muted)}.schedule{display:grid;gap:10px;margin-top:18px}.event{width:100%;text-align:left;display:grid;grid-template-columns:50px 1fr 23px;align-items:center;gap:12px;padding:13px;border-radius:16px;color:#fff1e0;background:#29334dbb;border:1px solid #8291ae44}.event:disabled{opacity:.66}.event:not(:disabled){border-color:#e4c38c88;background:linear-gradient(115deg,#40415c,#293750)}.event .symbol{font-size:26px;display:grid;place-items:center;height:49px;border- g{color:var(--gold);font-size:27px;display:block;margin:8px 0}.result .prize{font-size:20px}.footer{font-size:10px;text-align:center;letter-spacing:1.5px;color:#a6a7bc;margin:23px 0 0}.preview{display:none;background:#624e48;color:#fff0cb;padding:9px;font-size:11px;border-radius:8px;text-align:center;margin-bottom:10px}.note{font-size:11px;color:#b6b6ca}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="stars" id="stars" aria-hidden="true"></div><div id="confetti" class="confetti" aria-hidden="true"></div><main><div class="preview" id="preview">確認用プレビュー：すべてのプレゼントを開けます（本番では時間で解放）</div><div id="app"></div><div class="footer">MADE WITH LOVE · TOKYO → SENDAI · 2026</div></main><script>
'use strict';
const preview=new URLSearchParams(location.search).get('preview')==='1';const app=document.getElementById('app');const date=(h)=>new Date(`2026-12-02T${String(h).padStart(2,'0')}:00:00+09:00`).getTime();const events=[{time:0,icon:'🎂',name:'最初のおめでとう',desc:'日付が変わる、その瞬間に。'},{time:8,icon:'☀️',name:'たいきのバースデーおみくじ',desc:'新しい一年の始まりに。'},{time:12,icon:'🎁',name:'お昼のプレゼントガチャ',desc:'小さなご褒美をひとつ。'},{time:20,icon:'🚄',name:'東京から、たいきへ。',desc:'夜に届く、最後の贈り物。'}];let view=-1,timerId, micStream=null,micContext=null,micFrame=0;const key='taiki2026-'+(preview?'preview-':'');function load(k){try{return JSON.parse(localStorage.getItem(key+k)||'null')}catch{return null}}function save(k,v){try{localStorage.setItem(key+k,JSON.stringify(v))}catch{}}function unlocked(i){return preview||Date.now()>=date(events[i].time)}function el(id){return document.getElementById(id)}function stopMic(){cancelAnimationFrame(micFrame);if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}if(micContext){micContext.close().catch(()=>{});micContext=null}}
if(preview)el('preview').style.display='block';let stars='';for(let i=0;i<75;i++){let size=i%7===0?3:1.5;stars+=`<i style="left:${(i*73.19)%100}%;top:${(i*37.43)%100}%;width:${size}px;height:${size}px;animation-delay:${-(i%13)/3}s"></i>`}el('stars').innerHTML=stars;
function celebrate(){const box=el('confetti');box.innerHTML=Array.from({length:64},(_,i)=>`<i style="left:${(i*17.31)%100}%;--dx:${(i%2?1:-1)*(20+i%7*12)}px;background:${['#f6d494','#f3a6b7','#a9d3e5','#bdb1f0'][i%4]};animation-delay:${(i%13)*.055}s"></i>`).join('');setTimeout(()=>box.innerHTML='',4500)}
let audio;function tune(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const now=audio.currentTime+.04;const notes=[60,60,62,60,65,64,60,60,62,60,67,65,60,60,72,69,65,64,62,70,70,69,65,67,65];const durations=[.25,.25,.5,.5,.5,1,.25,.25,.5,.5,.5,1,.25,.25,.5,.5,.5,.5,1,.25,.25,.5,.5,.5,1];let t=now;notes.forEach((n,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+durations[i]*.92);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+durations[i]);t+=durations[i]})}catch{}}
const illustration=`<svg class="hero" viewBox="0 0 320 145" aria-hidden="true"><defs><radialGradient id="g"><stop stop-color="#f4d6a4" stop-opacity=".45"/><stop offset="1" stop-color="#f4d6a4" stop-opacity="0"/></radialGradient></defs><circle cx="160" cy="70" r="73" fill="url(#g)"/><path d="M30 119 Q85 96 160 120 T290 119" fill="none" stroke="#e5cb9355" stroke-dasharray="3 6"/><g fill="#e8cba0"><circle cx="40" cy="65" r="2"/><circle cx="274" cy="42" r="2"/><path d="M84 27l2 7 7 2-7 2-2 7-2-7-7-2 7-2zM244 92l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></g><rect x="115" y="62" width="90" height="64" rx="5" fill="#bc8395"/><rect x="107" y="53" width="106" height="18" rx="4" fill="#e5abb4"/><path d="M151 53h18v73h-18z" fill="#f5d89a"/><path d="M160 53 C119 55 116 16 137 26 Q152 35 160 53 M160 53 C201 55 204 16 183 26 Q168 35 160 53" fill="none" stroke="#f5d89a" stroke-width="7" stroke-linecap="round"/><path d="M160 53 Q147 60 143 83M160 53 Q173 60 177 83" fill="none" stroke="#f5d89a" stroke-width="5"/></svg>`;
function home(){stopMic();view=-1;app.innerHTML=`<header><div class="eyebrow">A SPECIAL DAY FOR ONE PERSON</div><h1>TAIKI'S<br>BIRTHDAY</h1><div class="sub">2026.12.02</div>${illustration}<p>今日は、たいきのための一日。<br>東京から4つの贈り物を届けます。</p></header><section class="panel" id="countbox"></section><section class="schedule" id="schedule"></section>`;updateHome();window.scrollTo(0,0)}
let previous='';function updateHome(){if(view!==-1)return;const next=events.findIndex((e,i)=>!unlocked(i));const status=events.map((e,i)=>`${unlocked(i)}-${!!load('done'+i)}`).join();if(previous!==status||!el('schedule').children.length){previous=status;el('schedule').innerHTML=events.map((e,i)=>`<button class="event" data-i="${i}" ${unlocked(i)?'':'disabled'}><span class="symbol">${e.icon}</span><span><small>${String(e.time).padStart(2,'0')}:00 · ${unlocked(i)?load('done'+i)?'OPENED':'OPEN':'LOCKED'}</small><b>${e.name}</b><em>${e.desc}</em></span><span class="status">${unlocked(i)?'›':'🔒'}</span></button>`).join('');el('schedule').querySelectorAll('button').forEach(b=>b.onclick=()=>openChapter(+b.dataset.i));if(next!==-1&&next>0&&Date.now()-date(events[next-1].time)<2000)celebrate();if(next===0){} }
if(next===-1){el('countbox').innerHTML='<div class="eyebrow">ALL GIFTS UNLOCKED</div><h2>すべてのお祝いが届いたよ。</h2><p>好きな贈り物を何度でも開いてね。</p>';return}const seconds=Math.max(0,Math.ceil((date(events[next].time)-Date.now())/1000));const pad=n=>String(n).padStart(2,'0');el('countbox').innerHTML=`<div class="eyebrow">NEXT SURPRISE · ${String(events[next].time).padStart(2,'0')}:00</div><p>${next===0?'たいきの誕生日まで':'次の贈り物まで'}</p><div class="timer"><div><strong>${pad(Math.floor(seconds/3600))}</strong><small>HOURS</small></div><div><strong>${pad(Math.floor(seconds/60)%60)}</strong><small>MINUTES</small></div><div><strong>${pad(seconds%60)}</strong><small>SECONDS</small></div></div><p class="note">時間になると自動で解放されるよ。</p>`;}
function openChapter(i){if(!unlocked(i))return;view=i;stopMic();const e=events[i];app.innerHTML=`<button class="back" id="back">‹ 贈り物一覧へ</button><section class="panel chapter"><div class="eyebrow">GIFT 0${i+1} · ${String(e.time).padStart(2,'0')}:00</div><h2>${e.name}</h2><div id="content"></div></section>`;el('back').onclick=home;window.scrollTo(0,0);[cake,fortune,gacha,rpg][i]();}
function cake(){const done=!!load('done0');el('content').innerHTML=`<p>たいき、お誕生日おめでとう！<br>今年は離れているけど、最初にお祝いを届けたくて。<br>願い事をひとつ思い浮かべてね。</p><svg id="cake" class="cake ${done?'out':''}" viewBox="0 0 300 185" aria-label="誕生日ケーキ"><defs><radialGradient id="flameglow"><stop stop-color="#ffdf8a" stop-opacity=".7"/><stop offset="1" stop-color="#ffdf8a" stop-opacity="0"/></radialGradient></defs><ellipse cx="150" cy="166" rx="111" ry="10" fill="#10192d"/><ellipse cx="150" cy="159" rx="105" ry="12" fill="#c6b6cb"/><rect x="61" y="107" width="178" height="47" rx="11" fill="#d49aa9"/><path d="M61 115Q80 138 99 115Q118 138 137 115Q156 138 175 115Q194 138 213 115Q227 135 239 115V102H61Z" fill="#fff0d9"/><ellipse cx="150" cy="103" rx="89" ry="18" fill="#fff0d9"/><rect x="82" y="71" width="136" height="34" rx="8" fill="#d9a4b3"/><ellipse cx="150" cy="73" rx="68" ry="14" fill="#fff2df"/>${[103,126,150,174,197].map((x,i)=>`<circle class="glow" cx="${x}" cy="36" r="29" fill="url(#flameglow)"/><rect x="${x-3}" y="43" width="6" height="29" rx="2" fill="${['#e4bb79','#ef9fae','#a9c9cf'][i%3]}"/><path class="flame" d="M${x} 23 Q${x-12} 39 ${x} 42 Q${x+12} 39 ${x} 23" fill="#ffda83"/>`).join('')}</svg><div id="cakeActions"></div><div id="cakeMsg"></div>`;if(done){cakeMessage();return}el('cakeActions').innerHTML='<button class="primary" id="blow">息を吹きかけて火を消す 🎂</button><button class="secondary" id="tapOut">タップで火を消す</button><p class="note" id="micStatus">マイクを使う場合は許可が必要です。音声の録音・送信はしません。</p>';el('tapOut').onclick=blowOut;el('blow').onclick=async()=>{const b=el('blow');b.disabled=true;el('micStatus').textContent='マイクを準備しています…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error();const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(view!==0||load('done0')){stream.getTracks().forEach(t=>t.stop());return}micStream=stream;micContext=new(window.AudioContext||window.webkitAudioContext)();await micContext.resume();const analyser=micContext.createAnalyser();analyser.fftSize=1024;micContext.createMediaStreamSource(stream).connect(analyser);const data=new Float32Array(analyser.fftSize);el('micStatus').textContent='ろうそくに向かって、ふーっと息を吹いてね！';let hits=0;function detect(){if(view!==0||!micStream)return;analyser.getFloatTimeDomainData(data);let rms=Math.sqrt(data.reduce((s,v)=>s+v*v,0)/data.length);hits=rms>.045?hits+1:Math.max(0,hits-1);if(hits>7)blowOut();else micFrame=requestAnimationFrame(detect)}detect()}catch{if(view===0&&el('micStatus')){el('micStatus').textContent='マイクが使えない場合は下のタップボタンで消せるよ。';b.disabled=false}}};}
function blowOut(){if(view!==0)return;stopMic();save('done0',true);el('cake').classList.add('out');celebrate();tune();cakeMessage()}
function cakeMessage(){el('cakeActions').innerHTML='';el('cakeMsg').innerHTML='<div class="result"><div class="eyebrow">HAPPY BIRTHDAY, TAIKI!</div><p>生まれてきてくれてありがとう。\nたいきにとって、笑顔の多い一年になりますように。\n今日はまだまだ、お楽しみがあるよ♡</p></div><button class="primary" id="next">贈り物一覧へ</button>';el('next').onclick=home}
const fortunes=[{name:'大吉',msg:'新しい思い出がたくさん増える一年。ふたりで初めての場所にも行ってみよう。',item:'あたたかい飲み物',word:'今日も自分のペースでね。'},{name:'大大吉',msg:'小さな幸せを見つけるのが上手になる一年。楽しいことが待っているよ。',item:'お気に入りの服',word:'いつも頑張っているたいきを応援してるよ。'},{name:'特大吉',msg:'大切な人と笑い合える時間が増える一年。素敵な景色を一緒に見よう。',item:'お気に入りの音楽',word:'無理しすぎず、今日を楽しんでね。'}];function fortune(){const saved=load('fortune');el('content').innerHTML='<p>おはよう、たいき！<br>誕生日の朝に、今年の運勢を占ってみよう。</p><span class="giftbox">⛩️</span><div id="outcome"></div>';if(saved!==null)showFortune(saved);else{el('outcome').innerHTML='<button class="primary" id="draw">おみくじを引く</button>';el('draw').onclick=()=>{let n=Math.floor(Math.random()*fortunes.length);save('fortune',n);save('done1',true);celebrate();showFortune(n)}}}function showFortune(n){const f=fortunes[n];el('outcome').innerHTML=`<div class="result"><div class="eyebrow">BIRTHDAY FORTUNE</div><strong>${f.name}</strong><p>${f.msg}</p><p>ラッキーアイテム：${f.item}</p><p>${f.word}</p></div><button class="primary" id="next">贈り物一覧へ</button>`;el('next').onclick=home}
const prizes=[['💆','マッサージ券','今度会ったときに、ゆっくりマッサージするね。'],['🍳','好きなご飯作る券','食べたいものをリクエストしてね。'],['🗺️','デート先決定券','次のデートの行き先はたいきが決めてね。'],['🤗','ぎゅーっとハグ券','会えたときに、好きなだけぎゅーしよう。']];function gacha(){const saved=load('prize');el('content').innerHTML='<p>お昼のお祝いは、ちょっとしたご褒美！<br>たいき専用のガチャを1回どうぞ。</p><svg viewBox="0 0 220 190" style="width:215px;max-width:100%;margin:8px auto;display:block" aria-hidden="true"><rect x="47" y="6" width="126" height="177" rx="24" fill="#bb7895"/><rect x="55" y="15" width="110" height="90" rx="19" fill="#313f58" stroke="#f7d69a" stroke-width="3"/><g fill="#e1b1bf"><circle cx="79" cy="78" r="17"/><circle cx="130" cy="64" r="18" fill="#e4c580"/><circle cx="111" cy="87" r="18" fill="#a6c4d1"/><circle cx="147" cy="87" r="13"/><circle cx="93" cy="45" r="15" fill="#b9a7d5"/></g><circle cx="110" cy="129" r="18" fill="#f7d69a"/><rect x="97" y="125" width="26" height="8" rx="4" fill="#a6767e"/><rect x="82" y="154" width="56" height="18" rx="8" fill="#343a55"/></svg><div id="outcome"></div>';if(saved!==null)showPrize(saved);else{el('outcome').innerHTML='<button class="primary" id="draw">ガチャを回す！</button>';el('draw').onclick=()=>{let n=Math.floor(Math.random()*prizes.length);save('prize',n);save('done2',true);celebrate();showPrize(n)}}}function showPrize(n){const p=prizes[n];el('outcome').innerHTML=`<div class="result"><div class="eyebrow">SPECIAL BIRTHDAY TICKET</div><strong>${p[0]}</strong><strong class="prize">${p[1]}</strong><p>${p[2]}</p><p class="note">スクリーンショットで保存してね。</p></div><button class="primary" id="next">贈り物一覧へ</button>`;el('next').onclick=home}
function rpg(){el('content').innerHTML='<span class="giftbox">🚄</span><p>今日の最後の贈り物は、小さな冒険。<br>東京から仙台まで、たいきへのお祝いを届ける旅に出よう。</p><a id="rpgLink" class="link" href="./birthday_express_taiki_music.html">冒険を始める ▶</a><p class="note">音楽が流れるよ。</p>';el('rpgLink').onclick=()=>save('done3',true)}
let lastMidnight=Date.now()>=date(0);home();timerId=setInterval(()=>{if(!preview&&!lastMidnight&&Date.now()>=date(0)){lastMidnight=true;openChapter(0);celebrate()}else updateHome()},500);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!preview&&!lastMidnight&&Date.now()>=date(0)){lastMidnight=true;openChapter(0);celebrate()}else updateHome()}});
</script></body></html>
