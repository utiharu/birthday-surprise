<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Mission 03</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 5%,#293b51,#101b2b 68%);color:#f7ead7;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;display:grid;place-items:center;padding:24px 16px}.card{width:min(100%,440px);border:1px solid #a58a60;border-radius:20px;padding:42px 25px;text-align:center;background:linear-gradient(145deg,#1d3045,#142337);box-shadow:0 20px 70px #0007}.eyebrow{font-size:11px;letter-spacing:.27em;color:#d8bc8b}.ornament{font-size:28px;color:#d8bc8b;margin:18px 0}h1{font-family:Georgia,serif;font-weight:normal;font-size:35px;margin:12px 0 20px;color:#f5dfb9}.rule{height:1px;background:linear-gradient(90deg,transparent,#a58a60,transparent);margin:24px 0}.message{font-size:15px;line-height:2.25;white-space:pre-line}.button{display:block;width:100%;border:0;border-radius:9px;padding:16px;margin-top:28px;background:#ddc393;color:#142337;font-weight:bold;font-size:14px;letter-spacing:.06em;text-decoration:none;cursor:pointer}.button.secondary{background:transparent;color:#e4cda5;border:1px solid #9e8866}.small{font-size:12px;color:#d4bd98;line-height:1.9}.hidden{display:none}.footer{margin-top:30px;font-size:10px;letter-spacing:.22em;color:#c4a979}.fade{animation:fade .65s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><main class="card"><div class="eyebrow">A LITTLE LETTER FOR YOU</div><div class="ornament">✧</div><section id="first" class="fade"><h1>How was lunch?</h1><div class="rule"></div><p class="message">お昼はおいしかったかな？
たくさん食べられたかな？♡

お腹も満たされたところで、
次は夜ご飯までの間に
ふたりの思い出の品を作りに行くよ。

何を作るかは、まだ秘密…♡</p><button class="button" id="next">NEXT — 次のヒントへ ✧</button></section><section id="second" class="hidden"><div class="eyebrow">SECRET MISSION 03</div><h1>Next Destination</h1><div class="rule"></div><p class="message">次は、このあたりまで向かおう！

何をするかは、現地に着いてからのお楽しみ♡

どんな思い出の品ができるかな？</p><a class="button" href="https://maps.app.goo.gl/a1K7ebjpAZ3c7WgMA" target="_blank" rel="noopener noreferrer">📍 地図を開いて向かう</a><button class="button secondary" id="back">手紙に戻る</button><p class="small">次の目的地へ、いってらっしゃい ♡</p></section><div class="footer">MADE WITH LOVE ♡</div></main><script>const a=document.getElementById('first'),b=document.getElementById('second');document.getElementById('next').onclick=()=>{a.classList.add('hidden');b.classList.remove('hidden');b.classList.add('fade')};document.getElementById('back').onclick=()=>{b.classList.add('hidden');a.classList.remove('hidden');a.classList.add('fade')};</script></body></html>
